name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-progress run when a newer commit supersedes it on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Type check
        # No path argument. pyproject already says WHICH trees are checked (the kernel and the batteries
        # beside it in examples/). Naming one here overrode that setting and quietly dropped the other.
        run: mypy
      - name: Architecture
        # The layers are enforced inside the suite too, so this cannot be the only place it runs - it is
        # here to fail with the contract's own name rather than as one line buried in a pytest report.
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        # The suite holds 100% line and branch coverage; the gate enforces it, so any drop fails CI.
        run: pytest --cov=cabaxiom --cov-report=term-missing --cov-fail-under=100

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the wheel
        # Install the BUILT artifact (not the source tree) and import it. A wheel missing py.typed or
        # packaging the wrong directory would otherwise ship green.
        run: |
          pip install dist/*.whl
          python -c "import cabaxiom; print('wheel ok:', cabaxiom.__version__)"
          python -c "import importlib.resources as r; assert r.files('cabaxiom').joinpath('py.typed').is_file(), 'py.typed missing from the wheel'"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
