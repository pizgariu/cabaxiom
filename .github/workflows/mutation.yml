name: Mutation

# Mutation testing is slow, so it runs weekly and on demand rather than on every push. It mutates the
# kernel and re-runs the suite. A surviving mutant is a line the tests cover without pinning its behaviour.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, 04:00 UTC

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run mutation testing
        # Skip coverage, the subprocess example smoke tests, and the stateful sequences per mutant. They add
        # cost without sharpening the kill. The contract and property tests are the mutant killers.
        env:
          PYTEST_ADDOPTS: "--no-cov --ignore=tests/test_examples.py --ignore=tests/test_stateful.py"
        run: mutmut run
      - name: Report survivors
        if: always()
        run: mutmut results
