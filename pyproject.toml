[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cabaxiom"
version = "0.7.0"
description = "A domain-agnostic reconciliation kernel - declare desired state as Steps, then converge and self-verify."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grzegorz Stolarz" }]
keywords = ["reconciliation", "desired-state", "idempotent", "convergence", "topological-sort", "state-machine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "hypothesis>=6", "mutmut>=3", "mypy>=1", "basedpyright>=1.21", "import-linter>=2", "pytest-bdd>=8"]

[project.urls]
Homepage = "https://github.com/pizgariu/cabaxiom"
Repository = "https://github.com/pizgariu/cabaxiom"
Changelog = "https://github.com/pizgariu/cabaxiom/blob/master/CHANGELOG.md"
Issues = "https://github.com/pizgariu/cabaxiom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cabaxiom"]

[tool.hatch.build.targets.sdist]
# An explicit list, because the default sweeps in whatever the working tree happens to hold. A build
# run from a developer's checkout would otherwise ship editor settings, local caches and untracked
# notes alongside the source. Naming what belongs makes the artifact the same whoever builds it.
include = [
  "/src",
  "/tests",
  "/examples",
  "/bench",
  "/docs/architecture.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501: dense explanatory comments run long by design, line width is left to a formatter not the linter
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# The batteries moved to examples/ and must NOT fall out of the strict gate on the way - they are
# published as things a reader will copy. Untyped example code is a worse example than none.
files = ["src", "examples/battery"]

# A SECOND OPINION, not a second gate. mypy --strict is what CI enforces and it stays that way. But
# two checkers disagree in useful places. This one found eighteen methods overriding a base without
# saying so, including twelve implementations of Addressing, which is a contract this repository does
# rename. What is switched off below is switched off for a stated reason. Every rule that can
# catch a real defect is left on - including the three it still reports, which are known and argued
# in partition.py. An abstract property satisfied by a class constant, which is correct Python, keeps
# the ABC's refusal to construct an incomplete shape and is a pattern this checker dislikes.
[tool.basedpyright]
include = ["src/cabaxiom"]
typeCheckingMode = "recommended"
# The kernel is domain agnostic. A user's Step arrives through the seam as an unknown callable and an
# unknown payload BY DESIGN, so demanding a named type at that boundary would mean deleting the
# genericity rather than typing it.
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
# Constructor parameters are annotated already. Repeating the annotation on the attribute they are
# assigned to is duplication. Duplication is the defect this repository keeps a changelog of.
reportUnannotatedClassAttribute = false
# A no-op hook on a base Observer or Scope declares its parameters because the SIGNATURE is the
# contract. Not touching them is what a default implementation is.
reportUnusedParameter = false
# Underscore names are how this package marks its own internals, on the class rather than on every
# method. Modules inside one package reading each other's is the convention, not a leak.
reportPrivateUsage = false
# Long messages are written as adjacent literals so a sentence can wrap where it reads best.
reportImplicitStringConcatenation = false
# Priming a generator with next() throws its first yield away on purpose.
reportUnusedCallResult = false
# The only cycles here are under TYPE_CHECKING, which is the documented way to type a back reference
# without importing one at runtime.
reportImportCycles = false
# `object` gets twenty of these for __repr__ and __eq__. Nobody is renaming those. Marking them
# buys noise. The overrides that a rename COULD break are marked in the source.
reportImplicitOverride = false
# A Step subclass's __init__ does not call super().__init__(): Step is an ABC that declares no __init__
# of its own and seals the instance through its metaclass after construction, so chaining to it would be
# a ceremonial call to object.__init__. The freeze is what enforces the contract, not a base constructor.
reportMissingSuperCall = false
# Two of these sit on `flat is latest`, where the assignment happens inside a closure the analyser
# does not follow. The identity check is real and covered by a live test.
reportUnnecessaryComparison = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The batteries live in examples/ and are NOT part of the wheel, so their tests reach them the way the
# example scripts do - through examples/ on the path. A script run as `python examples/x.py` gets that
# directory as sys.path[0] for free. This is the same import line spelled for the suite.
pythonpath = ["examples"]
addopts = "--cov=cabaxiom --cov=battery --cov-report=term-missing --cov-fail-under=100"
# pytest-bdd 8 registers fixtures through an API pytest 9 deprecates. The noise is the plugin's to fix, so it
# is filtered by TYPE, since pytest raises it from its own frames on the plugin's behalf. A DeprecationWarning
# raised from our own tests still fails loudly.
filterwarnings = ["error::DeprecationWarning:tests", "ignore::pytest.PytestRemovedIn10Warning"]

[tool.coverage.run]
# The kernel AND the batteries beside it. Moving the batteries out of the wheel must not quietly move
# them out of the coverage gate too - they were at 100% as shipped code and they stay there as examples.
source = ["cabaxiom", "battery"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "@(abc\\.)?abstractmethod", "@(typing\\.)?overload", "class .*\\(Protocol\\):"]

[tool.mutmut]
source_paths = ["src/cabaxiom"]
also_copy = ["README.md", "CHANGELOG.md", "docs", "examples", "bench"]

# The architecture, stated once and checked by a tool that resolves the import graph properly. The
# hand-rolled AST walk this replaces read only RELATIVE imports, so `from cabaxiom.core.record.diagram
# import Mermaid` inside the plan layer sailed straight past it - proven by planting exactly that and
# watching the suite stay green. grimp resolves absolute imports, relative ones, re-exports through an
# __init__ and imports written inside a function body, which is the whole reason to stop hand-rolling.
#
# Dev-only. Nothing here reaches the wheel, so the zero-runtime-dependency claim is untouched.
[tool.importlinter]
root_package = "cabaxiom"

[[tool.importlinter.contracts]]
name = "The kernel cannot see the laboratory"
type = "layers"
layers = ["cabaxiom.laboratory", "cabaxiom.core"]

[[tool.importlinter.contracts]]
name = "The kernel's four layers point one way"
type = "layers"
layers = [
    "cabaxiom.core.run",
    "cabaxiom.core.record",
    "cabaxiom.core.plan",
    "cabaxiom.core.declaration",
]

[[tool.importlinter.contracts]]
name = "The laboratory's benches point one way"
type = "layers"
layers = [
    "cabaxiom.laboratory.shrink",
    # Siblings, stated as siblings. proof and rig sit at the same height and neither imports the other,
    # so listing one above the other would declare an ordering the code does not have and would quietly
    # permit an arrow nobody intends.
    "cabaxiom.laboratory.proof : cabaxiom.laboratory.rig",
]
