[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cabaxiom"
version = "0.3.1"
description = "A domain-agnostic reconciliation kernel - declare desired state as Steps, then converge and self-verify."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grzegorz Stolarz" }]
keywords = ["reconciliation", "desired-state", "idempotent", "convergence", "topological-sort", "state-machine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6", "mutmut>=3", "mypy>=1"]

[project.urls]
Homepage = "https://github.com/pizgariu/cabaxiom"
Repository = "https://github.com/pizgariu/cabaxiom"
Changelog = "https://github.com/pizgariu/cabaxiom/blob/master/CHANGELOG.md"
Issues = "https://github.com/pizgariu/cabaxiom/issues"

[tool.hatch.build.targets.sdist]
# An explicit list, because the default sweeps in whatever the working tree happens to hold: a build
# run from a developer's checkout would otherwise ship editor settings, local caches and untracked
# notes alongside the source. Naming what belongs makes the artifact the same whoever builds it.
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cabaxiom"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501: dense explanatory comments run long by design, line width is left to a formatter not the linter
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cabaxiom --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["cabaxiom"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "@(abc\\.)?abstractmethod"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.mutmut]
source_paths = ["src/cabaxiom"]
